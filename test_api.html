<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .property {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .property img {
            max-width: 200px;
            border-radius: 4px;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Properties API Test</h1>
    <button onclick="fetchProperties()">Fetch Properties</button>
    <div id="result"></div>

    <script>
        async function fetchProperties() {
            try {
                const response = await fetch('http://localhost:8000/api/properties/list/');
                const data = await response.json();
                
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = '<h2>API Response:</h2>';
                
                // Show raw JSON
                resultDiv.innerHTML += `<h3>Raw Response:</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
                
                // Parse properties
                const properties = Array.isArray(data) ? data : (data.results || []);
                resultDiv.innerHTML += `<h3>Parsed Properties (${properties.length}):</h3>`;
                
                properties.slice(0, 3).forEach(prop => {
                    resultDiv.innerHTML += `
                        <div class="property">
                            <h4>${prop.title}</h4>
                            <img src="${prop.image}" alt="${prop.title}" onerror="this.src='/P1.png'">
                            <p><strong>Location:</strong> ${prop.location}</p>
                            <p><strong>Price:</strong> ${prop.price}</p>
                            <p><strong>Status:</strong> ${prop.status}</p>
                            <p><strong>Type:</strong> ${prop.type}</p>
                            <p><strong>Bedrooms:</strong> ${prop.bedrooms}</p>
                            <p><strong>Bathrooms:</strong> ${prop.bathrooms}</p>
                            <p><strong>Area:</strong> ${prop.area}</p>
                        </div>
                    `;
                });
                
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h2 style="color: red;">Error:</h2>
                    <pre>${error.message}\n${error.stack}</pre>
                `;
            }
        }
        
        // Auto-fetch on load
        window.onload = fetchProperties;
    </script>
</body>
</html>
